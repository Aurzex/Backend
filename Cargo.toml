[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
crate-type = ["rlib"]

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"

# 性能基准专用档:发布档是 `opt-level = "z"` + `panic = "abort"`(为体积/嵌入),
# 量测热路径会失真。本档只服务 `tests/convert_bench.rs`(方案 23 §5),
# 不影响发布产物;跑法见该文件头注释。
[profile.bench_perf]
inherits = "release"
opt-level = 3
lto = false
debug = false
panic = "unwind"

[lints.rust]
# `unused` 组已整体恢复 `warn`(rounds/40 R2 三阶段:机械族 → `dead_code` → 收口)。
# 门是 `cargo clippy --all-targets -- -D warnings` ⇒ 任何残留都会红:新增死代码要么接上调用、
# 要么标 `#[cfg(test)]`、要么 `#[allow(dead_code)]` + 一句理由(口径见 `docs/knowledge/repo-conventions.md`)。
# 过程记录(含"组的 level 要配 `priority = -1`"这条坑)见 `docs/goals/infra-backlog.md` §1.1。
unused = "warn"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
fastrand = "2.5.0"
log = "0.4.34"
serde = {
    version = "1.0.229",
    features = ["derive"]
}
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
tungstenite = {
    version = "0.30.0",
    features = ["rustls-tls-webpki-roots"]
}
url = "2.5.8"
ureq = {
    version = "3.4.0",
    features = ["json", "multipart", "gzip"]
}
