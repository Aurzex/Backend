[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
crate-type = ["rlib"]

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"

# 性能基准专用档:发布档是 `opt-level = "z"` + `panic = "abort"`(为体积/嵌入),
# 量测热路径会失真。本档只服务 `tests/convert_bench.rs`(方案 23 §5),
# 不影响发布产物;跑法见该文件头注释。
[profile.bench_perf]
inherits = "release"
opt-level = 3
lto = false
debug = false
panic = "unwind"

[lints.rust]
# `unused` 组分阶段放开(rounds/40 R2):组保持 `allow` 兜底,逐族用**单条** lint 覆盖。
# 组的 `level` 必须配 `priority = -1`,否则 clippy 的 `lint_groups_priority`(deny 默认)
# 直接报错 —— 它要求成员比所在组更具体(同优先级会被判定为"顺序未定义")。
# 注意显式 `warn` **挡不住** `clippy --all-targets -- -D warnings`,所以每放开一族前
# 阶段 1 = 机械族(下面 5 条);`dead_code` 待阶段 2 逐条判完后单独开。
unused = { level = "allow", priority = -1 }
unused_imports = "warn"
unused_variables = "warn"
unused_mut = "warn"
unused_assignments = "warn"
unused_must_use = "warn"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
fastrand = "2.5.0"
log = "0.4.34"
serde = {
    version = "1.0.229",
    features = ["derive"]
}
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
thiserror = "2.0.20"
tungstenite = {
    version = "0.30.0",
    features = ["rustls-tls-webpki-roots"]
}
url = "2.5.8"
ureq = {
    version = "3.4.0",
    features = ["json", "multipart", "gzip"]
}
