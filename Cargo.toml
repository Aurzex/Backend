[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "backend"
crate-type = ["cdylib"]

[lints.rust]
unused = "allow"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
# pyo3 = "0"
rand = "0.10.0"
serde = {version="1",features=["derive"]}
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
ureq = {version="3",features=["json","multipart"]}
