[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
crate-type = ["cdylib"]

[lints.rust]
unused = "allow"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.10.0"
serde = {
	version = "1",
    features = ["derive"]
}
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
wreq = { version = "*", features = ["websocket"] }
wreq-util = "*"
futures-util = { version = "0.3", features = ["sink", "std"] }
url = "2"
http = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "json",
    "cookies",
    "multipart",
    "stream",
    "query",
    "gzip",
    "http2"
] }
tokio = { version = "1", features = ["rt", "macros","rt-multi-thread","sync", "time",] }
