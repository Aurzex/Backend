[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"

[lints.rust]
unused = "allow"

[dependencies]
aes-gcm = "0.11.0"
base64 = "0.23.1"
fastrand = "2.5.0"
log = "0.4.33"
serde = {
    version = "1.0.229",
    features = ["derive"]
}
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.19"
tungstenite = {
    version = "0.30.0",
    features = ["rustls-tls-webpki-roots"]
}
url = "2.5.8"
ureq = {
    version = "3.3.0",
    features = ["json", "multipart", "gzip"]
}
