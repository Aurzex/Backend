[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
crate-type = ["cdylib"]

[lints.rust]
unused = "allow"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.10.0"
serde = {
	version = "1",
    features = ["derive"]
}
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
ureq = {
	version = "3",
    features = ["json", "cookies", "multipart","gzip"]
}
url = "2"
tungstenite = {
	version = "0.29",
    features = ["handshake","rustls-tls-webpki-roots"]
}
http = "1.4.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12","aws-lc-rs"] }
webpki-roots = "0.26"
rustls-native-certs="0.8"
