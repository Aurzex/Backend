[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "backend"
crate-type = ["cdylib"]

[profile.release]
strip = true
opt-level = "z"
lto = true
panic = "abort"

[lints.rust]
unused = "allow"

[dependencies]
aes-gcm = "0"
base64 = "0"
fastrand ="2"
log = "0"
serde = {
	version = "1",
    features = ["derive"]
}
serde_json = "1"
sha2 = "0"
thiserror = "2"
ureq = {
	version = "3",
    features = ["json", "cookies", "multipart","gzip"]
}
