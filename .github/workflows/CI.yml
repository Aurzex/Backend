name: CI

on:
    push:
        branches:
            - main
            - master
        tags:
            - "*"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x86_64
                      os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                      artifact: backend-linux-x86_64
                      libname: libbackend.so
                    - name: linux-aarch64
                      os: ubuntu-22.04
                      target: aarch64-unknown-linux-gnu
                      artifact: backend-linux-aarch64
                      libname: libbackend.so
                      linker: aarch64-linux-gnu-gcc
                    - name: windows-x86_64
                      os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact: backend-windows-x86_64
                      libname: backend.dll
                    - name: macos-x86_64
                      os: macos-15-intel
                      target: x86_64-apple-darwin
                      artifact: backend-macos-x86_64
                      libname: libbackend.dylib
                    - name: macos-aarch64
                      os: macos-latest
                      target: aarch64-apple-darwin
                      artifact: backend-macos-aarch64
                      libname: libbackend.dylib
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}
            - name: Install cross linker for aarch64 Linux
              if: matrix.linker != ''
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu
                  echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            - name: Build release
              run: cargo build --release --target ${{ matrix.target }}
            - name: Upload artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ${{ matrix.artifact }}
                  path: target/${{ matrix.target }}/release/${{ matrix.libname }}
